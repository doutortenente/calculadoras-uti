name: Testar e empacotar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de teste
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar o app em tela de celular
        run: python tests/autoteste.py docs/index.html

  empacotar:
    if: github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o worker da Cloudflare
        run: python3 tools/empacotar.py
      - name: Guardar o pacote testado na branch publicado
        run: |
          cp dist/worker.js "$RUNNER_TEMP/worker.js"
          git checkout -q --orphan publicado
          git rm -rfq .
          cp "$RUNNER_TEMP/worker.js" worker.js
          git add worker.js
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Pacote de ${GITHUB_SHA::7}"
          git push -qf origin publicado
